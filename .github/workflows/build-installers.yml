# 编译 + 打包安装包：macOS 出 DMG，Windows 出 MSI 与 NSIS exe，Linux 出 DEB。
#
# 手动跑：Actions → 打包安装包 → Run workflow。打 tag 跑：`git tag v1.4.0 && git push origin v1.4.0`。
# 三个平台是同一个 job 的矩阵，差异全在 `matrix` 里；补齐/顺序等约束见「如何编译打包.md」第四节。
#
# ⚠️ 新 workflow 首次推送后可能不被 Actions 索引（Actions 页空的、`total_count = 0`）。
#    空提交没用 —— 必须改到 `.github/workflows/**` 里的文件本身才会被重新解析注册。
#
# 编译链上不做 `cargo install tauri-cli`（CLI 在 devDependencies 里，`pnpm exec tauri` 直接可用），
# 也不需要 Python（补齐与检查全是 Node）。

name: 打包安装包

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译成功后把安装包上传到 Release（打 tag 时必勾）'
        type: boolean
        default: false
      verbose:
        description: '打开 tauri 的详细日志（打包失败时用来定位）'
        type: boolean
        default: false
  push:
    # 版本 tag 是 `v1.4.0` 这种。带数字是为了不误触发：宽泛的 `v*` 会连
    # 「随手建的 v-something」也一起跑。
    tags: ['v[0-9]*']

permissions:
  contents: write          # tag 触发时要把安装包传上 Release，需要写权限

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    # 一个平台红了不要取消另一个 —— 它们本来就互不影响。
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-latest` 是 Apple Silicon（macOS 26 arm64）。随包的二进制由
          # `tools/fetch_tools.mjs` 按**构建机架构**取，所以这个包装出来是 arm64 的：
          # 能装进 Intel Mac，但一调 ffmpeg 就会失败。要让 Intel 也能用，得先让那个脚本
          # 按**目标**架构取件（现在按 `process.arch`），再 lipo —— 没做之前别改成 universal。
          #
          # 没有 Apple 证书：`bundle.macOS.signingIdentity` 是 `"-"`（ad-hoc），不签名也能在
          # Apple Silicon 上跑，只是从浏览器下的 dmg 第一次要右键 →「打开」放行。不要 secret。
          - os: macos-latest
            label: macOS (DMG)
            slug: dmg
            target: aarch64-apple-darwin
            bundleArgs: --bundles app,dmg
            timeout: 90
            bundleGlob: src-tauri/target/release/bundle/dmg/*.dmg
            releaseFiles: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/SHA256SUMS-dmg.txt

          # ubuntu-22.04 而不是 ubuntu-latest：`latest` 会随 GitHub 换（现在是 24.04），
          # 而 .deb 里的 glibc 下限跟着构建机走 —— 用 22.04 打出来的包在更老的发行版上
          # 也装得上。换构建机等于悄悄抬高用户的要求，所以要显式钉住。
          #
          # 只出 deb（不出 AppImage）：AppImage 要额外拉 appimagetool、还要 FUSE，
          # 这些都不随 GitHub 镜像预装 —— 为一件装法在 CI 里多一条易碎的路不值。
          # 想要 AppImage 的人在本地 `pnpm exec tauri build --bundles appimage` 就行。
          - os: ubuntu-22.04
            label: Linux (DEB)
            slug: deb
            target: x86_64-unknown-linux-gnu
            bundleArgs: --bundles deb
            timeout: 90
            bundleGlob: src-tauri/target/release/bundle/deb/*.deb
            releaseFiles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/SHA256SUMS-deb.txt

          # windows-latest 上预装了 MSVC + Windows SDK（链接需要）、Node.js、Edge。
          # 不加 `--bundles`：默认按 `tauri.conf.json` 的 `"targets": "all"` 出 MSI 与 NSIS exe。
          - os: windows-latest
            label: Windows (MSI)
            slug: msi
            target: x86_64-pc-windows-msvc
            bundleArgs: ''
            timeout: 120   # release 编译 + 含 ~240MB 资源的 MSI 打包（主要是压缩慢）
            bundleGlob: src-tauri/target/release/bundle/msi/*.msi
            # 两个都传：README 里列的就是两种装法。
            releaseFiles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/SHA256SUMS-msi.txt

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v7

      # ⚠️ 顺序不能反：`setup-node` 的 `cache: pnpm` 要求 pnpm 已经装好
      - name: 装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # Node 既是前端构建（Vite）要的，也是 `tools/*.mjs` 要的。Vite 8 要求 Node 20.19+ / 22.12+。
      - name: 装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # 仓库自己的几张表、以及仓库与 workflow 的漂移 —— 这些在本地跑不到（YAML 读不到
      # JS 常量），只会在 CI 里炸，而那时每轮要等十几分钟。放在最前面，早失败。
      # 壁纸握手那条是**跑脚本**而不是查表：坏掉的表现是「重启后背景不动」，编译期看不出来。
      #
      # ⚠️ 显式用 bash：Windows 的默认 shell 是 pwsh，而 pwsh 只透传**最后一条**命令的
      #    退出码 —— 前两条红了这步照样是绿的。bash 默认带 `-e`，任一条失败就停。
      - name: 核对仓库与 workflow 一致
        shell: bash
        run: |
          node tools/check-artifact-paths.mjs
          node tools/check_assets_agree.mjs
          node tools/check_version_agree.mjs
          node tools/check_wallpaper_handshake.mjs

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      # ffmpeg 的 macOS 档是 `.tar.xz`，而 Node 没有 liblzma（见 tools/archive.mjs）——
      # 解它要系统的 `xz`。镜像里通常自带，没有就装一个（`brew` 在 arm64 上是
      # /opt/homebrew，别写死路径）。Linux 不需要这一步：deb 不带 ffmpeg，
      # 没有要解的 `.tar.xz`（其余随包件全是 zip / tgz / 裸二进制）。
      - name: 确保有 xz（解 ffmpeg 的 .tar.xz 用）
        if: runner.os == 'macOS'
        run: command -v xz >/dev/null || brew install xz

      # Tauri 的 Linux 链接依赖（webkit2gtk 那一串）。镜像里不预装，缺一个就链接失败。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 cargo。含 ~240MB 资源的 MSI 每次都要重新打包，但增量编译能省下大头
      # （第一次跑会慢，之后就快了）。key 里带 `runner.os`，两个平台各一份。
      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 编译并打包
        env:
          TAURI_LOG: ${{ inputs.verbose && 'debug' || '' }}
        run: pnpm exec tauri build ${{ matrix.bundleArgs }}

      # 安装包文件名里的 `beta` 只能在这里补：Windows Installer 的 `ProductVersion` 只吃
      # 纯数字 `x.y.z`，所以 `Cargo.toml` 是纯数字、产物天生叫 `…_x.y.z_x64_zh-CN.msi`，
      # 而用户要的名字与界面显示的版本（`config_file.rs::APP_VERSION`）都带 `beta`。
      # ⚠️ 必须在下面几步**之前**：冒烟要求「恰好一个 MSI」，传 artifact 与传 Release 都按
      #    `*.msi` / `*.dmg` 取件，改完名这几处都跟着走。
      - name: 安装包文件名加 beta
        run: node tools/rename-bundles-beta.mjs

      # ⚠️ 产物**先**传成 build artifact，再跑冒烟：这样万一冒烟红了，安装包仍然能在
      #    Actions 页面下载到（少一次「白等半小时什么都没拿到」）。传 Release 仍在冒烟之后。
      - name: 传安装包（build artifact）
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-${{ matrix.slug }}
          path: ${{ matrix.bundleGlob }}
          if-no-files-found: error      # 没打出安装包却"成功"，比失败更糟

      # NSIS 的 exe 安装程序：与 MSI 同一个程序的另一种装法，也一起传 Release。
      - name: 传 exe 安装程序（build artifact）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-setup
          # target 目录被 .gitignore 忽略，但 artifact 是文件系统层面的，照传不误
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 让「装出来是对的」有证据，而不是只看编译退出码。判据按平台分叉，见该脚本文件头。
      - name: 冒烟（核对产物）
        run: node tools/smoke-package.mjs

      # 校验清单：App 里「下载新版本」拿它核对下载到的安装包（见 `src-tauri/src/ipc/update.rs`）。
      # ⚠️ 三条约束：
      #   ① 必须在**改完名之后**生成 —— 清单里记的是最终文件名（带 beta 那个）；
      #   ② 名字必须是 `SHA256SUMS-<slug>.txt`，slug 与 matrix 的 slug 一致，App 按平台找它；
      #   ③ 行里只能是**裸文件名**（`sha256sum *.msi`，别写成 `./*.msi` 或带目录）——
      #       App 按文件名匹配，带路径就找不到，于是静默跳过核对。
      - name: 生成校验清单
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          case "${{ matrix.slug }}" in
            msi) ( cd msi  && sha256sum *.msi ) > SHA256SUMS-msi.txt
                 ( cd nsis && sha256sum *.exe ) >> SHA256SUMS-msi.txt ;;
            dmg) ( cd dmg  && sha256sum *.dmg ) > SHA256SUMS-dmg.txt ;;
            deb) ( cd deb  && sha256sum *.deb ) > SHA256SUMS-deb.txt ;;
          esac
          echo "--- SHA256SUMS-${{ matrix.slug }}.txt ---"
          cat SHA256SUMS-${{ matrix.slug }}.txt

      - name: 传校验清单（build artifact）
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-checksums-${{ matrix.slug }}
          path: src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.slug }}.txt
          if-no-files-found: error

      - name: 传安装包到 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.releaseFiles }}
          generate_release_notes: true
