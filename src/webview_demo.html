<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-Synth-Studio · WebView</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    background: #f2f4f7; color: #1b1d22;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101216; color: #e6e8ec; }
    .card { border-color: #2e343e; background: #171a20; }
    button { background: #2f6fce; border-color: #2f6fce; }
  }
  .card {
    width: min(560px, calc(100vw - 48px)); padding: 28px;
    border: 1px solid #d9dee5; border-radius: 14px; background: #fff;
  }
  h1 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 16px; line-height: 1.7; color: #5b626c; }
  @media (prefers-color-scheme: dark) { p { color: #a4abb6; } }
  button {
    padding: 9px 16px; border: 1px solid #2f6fce; border-radius: 8px;
    background: #2f6fce; color: #fff; font: inherit; cursor: pointer;
  }
  #state { margin-top: 18px; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
  <main class="card">
    <h1>文字 PV · WebView 验证</h1>
    <p>这一段由 Wry 的 Windows WebView2 渲染。确认它能在 gpui-kit 窗口里创建、布局，并在切页时正确隐藏。</p>
    <button id="ping">点一下</button>
    <p id="state">WebView 已加载。</p>
  </main>
  <script>
    let clicks = 0;
    document.getElementById('ping').addEventListener('click', () => {
      clicks += 1;
      document.getElementById('state').textContent = `WebView 脚本运行正常：${clicks} 次点击`;
    });
  </script>
</body>
</html>
