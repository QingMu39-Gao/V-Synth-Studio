[package]
name = "v-synth-studio"
version = "1.6.0"
edition = "2024"

[dependencies]
async-channel = "2"
encoding_rs = "0.8"
flate2 = "1"
gpui-kit = "0.8.0"
gpui-webview = "0.8.0"
open = "5"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"
urlencoding = "2"
wry = { version = "0.53.3", package = "lb-wry" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Windows: GPUI's DirectComposition target must sit below native child windows,
# otherwise the Wry/WebView2 child is painted behind the GPUI surface (white page).
# Only one line differs from gpui-pre-windows 0.3.9; drop this when upstream allows
# choosing the target order.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
