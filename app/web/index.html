<title>V-Synth-Studio</title>
<script>
/* 主题与性能模式必须在**首次绘制前**定下来，否则会先闪一下相反的配色 / 毛玻璃。
   所以这一段内联、同步、不依赖任何模块 —— 模块是异步加载的，来不及。

   取值规则和旧前端一致（见 theme.js / perf.js 的注释）：
   localStorage 是同步的，是**主存**；后端 config 只在本地什么都没存过时兜底。 */
(function () {
  var d = document.documentElement
  try {
    var t = localStorage.getItem('qingmu.theme')
    // 默认**暗色**，不跟随系统。
    // 旧前端原来是从系统偏好起手的，但那是它自己的选择；新前端的视觉基线是暗色下的
    // 玻璃层次（背景层做了额外的环境光晕），而且毛玻璃在深底上才看得出来。
    // 用户手动选过就听用户的，'system' 仍然有效（走下面那条分支）。
    if (t !== 'light' && t !== 'dark' && t !== 'system') {
      t = 'dark'
    }
    d.dataset.theme = t === 'system'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark')
      : t
    // 性能模式：开启后全局取消高斯模糊（backdrop-filter 在低端机 / 远控 / 集显上很贵）
    d.dataset.perf = localStorage.getItem('qingmu.perf') === 'on' ? 'on' : 'off'
  } catch (e) {
    d.dataset.theme = 'dark'
    d.dataset.perf = 'off'
  }
})()
</script>

<body>
<!--
  启动加载画面。**静态存在**，模块还没跑起来时它就在屏幕上 ——
  否则「等 JS 下载解析 + 等 /api/state 探测完 ffmpeg/yt-dlp（2~3 秒）」这段时间是白屏。

  三条规矩（和旧前端 `app/web/index.html` 的 `#boot` 对齐）：
   1. 样式**内联在这一段**，不能等 CSS 包 —— 等它就没意义了。
   2. 颜色用字面量，不能用库的 `--lg-*`：那些 token 挂在 `[data-lg-theme]` 下，
      而那是 `GlassProvider` 运行后才写的。这里只认上面那段内联脚本写的 `data-theme`。
   3. **必须有兜底**：谁都不该被永久卡在加载页。12 秒没揭开就显示「重新载入」，
      揭开由 `src/lib/boot.ts` 的 `hideBoot()` 负责（App 在首次 /api/state 落定后调）。
-->
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <div class="boot-mark">
      <img src="/img/logo.png" alt="" width="76" height="76">
      <span class="boot-sweep" aria-hidden="true"></span>
    </div>
    <div class="boot-title">V-Synth-Studio</div>
    <div class="boot-sub">正在载入工作台…</div>
    <div class="boot-sub boot-stuck">本地服务没有响应。可以点下面重新载入。</div>
    <div class="boot-bar" aria-hidden="true"><span></span></div>
    <button class="boot-retry" type="button" onclick="location.reload()">重新载入</button>
  </div>
</div>

<style>html,body{margin:0}.boot{z-index:9999;color:#eef1f6;background:#0b0d12;place-items:center;transition:opacity .3s,visibility .3s;display:grid;position:fixed;inset:0}html[data-theme=light] .boot{color:#1b2027;background:#f3f4f6}.boot[data-out=true]{opacity:0;visibility:hidden}.boot[data-out=true] .boot-card{opacity:0;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .26s;transform:translateY(-10px)scale(1.035)}@media (prefers-reduced-motion:reduce){.boot[data-out=true] .boot-card{transition:none}}.boot-card{flex-direction:column;align-items:center;gap:14px;animation:.5s cubic-bezier(.16,1,.3,1) both boot-in;display:flex}@keyframes boot-in{0%{opacity:0;transform:translateY(8px)scale(.98)}to{opacity:1;transform:none}}.boot-mark{width:76px;height:76px;margin-bottom:6px;position:relative}.boot-mark img{border-radius:20px;width:76px;height:76px;animation:2.6s ease-in-out infinite boot-breathe}@keyframes boot-breathe{0%,to{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}.boot-sweep{background:conic-gradient(from 0deg, transparent 0 62%, #39c5bb 94%, transparent 100%);border-radius:50%;animation:1.5s linear infinite boot-spin;position:absolute;inset:-11px;-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,#0000 calc(100% - 2px),#000 calc(100% - 2px))}@keyframes boot-spin{to{transform:rotate(1turn)}}.boot-title{letter-spacing:-.02em;font-family:system-ui,Microsoft YaHei,sans-serif;font-size:17px;font-weight:600}.boot-sub{opacity:.62;font-family:system-ui,Microsoft YaHei,sans-serif;font-size:13px}.boot-stuck{display:none}.boot-bar{background:color-mix(in srgb, currentColor 18%, transparent);border-radius:999px;width:168px;height:3px;overflow:hidden}.boot-bar span{border-radius:inherit;background:#39c5bb;width:40%;height:100%;animation:1.25s cubic-bezier(.4,0,.2,1) infinite boot-slide;display:block}@keyframes boot-slide{0%{transform:translate(-110%)}to{transform:translate(310%)}}.boot-retry{color:#04231f;font:inherit;cursor:pointer;background:#39c5bb;border:0;border-radius:10px;margin-top:2px;padding:7px 16px;font-family:system-ui,Microsoft YaHei,sans-serif;font-size:13px;font-weight:600;display:none}.boot[data-stuck=true] .boot-sub:not(.boot-stuck){display:none}.boot[data-stuck=true] .boot-stuck{display:block}.boot[data-stuck=true] .boot-bar{display:none}.boot[data-stuck=true] .boot-retry{display:inline-flex}@media (prefers-reduced-motion:reduce){.boot-card,.boot-mark img,.boot-sweep,.boot-bar span{animation:none}}</style>
<script>
  /* 揭开由 src/lib/boot.ts 负责；这里只管兜底 */
  setTimeout(function () {
    var b = document.getElementById('boot')
    if (b && b.dataset.out !== 'true') b.dataset.stuck = 'true'
  }, 12000)
</script>

<div id="root"></div>
