[package]
name = "v-synth-studio"
version = "1.2.0"
description = "V-Synth-Studio"
authors = ["QingMu"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 服务：实现和 Node 后端完全相同的 39 个路由，前端零改动
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# 下载 / B 站解析 / 链接检查要用
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# B 站弹幕接口返回的是裸 deflate（没有 Content-Encoding 头），要自己解。
# 它本来就在依赖树里（tauri 带着 flate2），不是为这个功能新拉的。
flate2 = "1"

# 从 LibreSVIP 插件的 .yapsy-plugin 里读格式元数据（其实是个 INI）
# 不引 INI 库 —— 那个格式只有 key = value，自己解析十行就够

# 只有 Unix 下需要：给进程组发信号，把子进程树一起收掉
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 系统「下载」目录（读注册表 KNOWNFOLDERID，见 platform.rs）
# Win32_Globalization 只有一个用处：导入歌词时用 MultiByteToWideChar 把 GBK 转成
# UTF-8（国内老 LRC 有相当一部分是 GBK）。同一份 kernel32 绑定，不引编码库、不加体积。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
] }

[profile.release]
# 发布版压体积：这个外壳没有计算密集的活儿，压体积比压速度划算。
#
# 但不用 `lto = true` + `codegen-units = 1` —— 那是最慢的组合，
# 一千个依赖 crate 要编几十分钟，而体积只比 thin LTO 小几个百分点。
# thin LTO 拿到绝大部分收益，构建时间少一大截。
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
