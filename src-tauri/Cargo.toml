[package]
name = "v-synth-studio"
version = "1.5.0"
description = "QingMu39's VOCALOID workstation."
authors = ["QingMu39", "FuBangkun"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "v_synth_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "sync", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "json", "stream"] }
futures-util = "0.3"
flate2 = "1"
# 下载的安装包与 `SHA256SUMS` 清单核对用。**不能用 CRC32**（flate2 / zip 里那个）：
# 那种校验值能被人顺手改成一致的，挡不住「半路被换成别的安装包」。
sha2 = "0.10"
# `cuda` 只为了拿到 `ort::ep::CUDA` 这个类型（在 ort 里被 `#[cfg(feature = "cuda")]` 门住），
# 不构成构建期 CUDA 依赖：ort 的 cuda feature 只打开 API，真正 LoadLibrary 的在运行时，
# 而 `load-dynamic` 已让 ort-sys 带上 `disable-linking`，链接期不碰任何 CUDA 库。
# 所以没有 N 卡 / 没装 CUDA 的机器照样跑，只是 GPU 那一格锁着。
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic", "cuda"] }
ndarray = "0.17"
tauri-plugin-dialog = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
